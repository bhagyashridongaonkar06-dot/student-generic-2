<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch students with generic and firebase 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card stdcard">
                    <div class="card-body">
                        <form action="" id="stdForm">
                            <div class="form-group">
                                <label for="fname">First Name</label>
                                <input type="text" required class="form-control" id="fname">
                            </div>
                            <div class="form-group">
                                <label for="lname">Last Name</label>
                                <input type="text" required class="form-control" id="lname">
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="text" required class="form-control" id="email">
                            </div>

                            <div class="form-group">
                                <label for="contact">Contact</label>
                                <input type="number" required class="form-control" id="contact">
                            </div>


                            
                            <button class="btn btn-sm btn-block btn-success" id="addStd">Add Student</button>
                            <button type="button" class="btn btn-sm btn-block btn-warning d-none" id="updateStd">Update
                                Student</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card  stdcard text-white">
                    <div class="card-body table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                    <th>Edit/Remove</th>
                                </tr>
                            </thead>

                            <tbody id="stdContainer">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td class="d-flex justify-content-between">
                                        <button type="button" class="btn btn-success btn-sm mr-2">Edit</button>
                                        <button type="button" class="btn btn-danger btn-sm">Remove</button>
                                    </td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
